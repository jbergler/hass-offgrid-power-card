<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 425" role="img" aria-labelledby="title description">
  <title id="title">Off-grid Power Card</title>
  <desc id="description">A Home Assistant card showing solar power, a charging battery, and calculated load connected by directional power flows.</desc>
  <rect width="900" height="425" rx="12" fill="#fff"/>
  <text x="20" y="40" font-family="Roboto,Arial,sans-serif" font-size="22" font-weight="600" fill="#212121">RV power</text>

  <g stroke="#03a9f4" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M232 178H440" stroke-dasharray="3 8"/>
    <path d="M460 178H680" stroke-dasharray="3 8"/>
    <path d="M450 188V250" stroke-dasharray="3 8"/>
  </g>
  <g fill="#03a9f4">
    <path d="M440 172l12 6-12 6z"/>
    <path d="M668 172l12 6-12 6z"/>
    <path d="M444 238l6 12 6-12z"/>
  </g>
  <circle cx="450" cy="178" r="7" fill="#fff" stroke="#03a9f4" stroke-width="3"/>

  <g font-family="Roboto,Arial,sans-serif">
    <g transform="translate(56 128)">
      <rect width="176" height="100" rx="12" fill="#fff" stroke="#d9dde3" stroke-width="2"/>
      <circle cx="30" cy="48" r="8" fill="none" stroke="#6b7280" stroke-width="2"/>
      <g stroke="#6b7280" stroke-width="2"><path d="M30 31v7M30 58v7M13 48h7M40 48h7M18 36l5 5M37 55l5 5M42 36l-5 5M23 55l-5 5"/></g>
      <text x="58" y="29" font-size="14" fill="#6b7280">Solar</text>
      <text x="58" y="59" font-size="26" font-weight="500" fill="#212121">850 W</text>
      <text x="58" y="81" font-size="14" fill="#6b7280">2.4 kWh today</text>
    </g>

    <g transform="translate(680 138)">
      <rect width="152" height="80" rx="12" fill="#fff" stroke="#d9dde3" stroke-width="2"/>
      <path d="M20 44V29l11-9 11 9v15H34V34h-6v10z" fill="none" stroke="#6b7280" stroke-width="2" stroke-linejoin="round"/>
      <text x="58" y="29" font-size="14" fill="#6b7280">Load</text>
      <text x="58" y="59" font-size="26" font-weight="500" fill="#212121">630 W</text>
    </g>

    <g transform="translate(340 250)">
      <rect width="220" height="148" rx="12" fill="#fff" stroke="#d9dde3" stroke-width="2"/>
      <rect x="18" y="22" width="22" height="13" rx="2" fill="none" stroke="#6b7280" stroke-width="2"/>
      <path d="M42 26v5" stroke="#6b7280" stroke-width="2"/>
      <text x="56" y="34" font-size="14" fill="#6b7280">Battery</text>
      <text x="18" y="82" font-size="28" font-weight="500" fill="#212121">68%</text>
      <rect x="88" y="67" width="114" height="10" rx="5" fill="#d9dde3"/>
      <rect x="88" y="67" width="78" height="10" rx="5" fill="#03a9f4"/>
      <text x="18" y="111" font-size="14" fill="#6b7280">Charging 220 W</text>
      <text x="18" y="135" font-size="14" fill="#6b7280">3 h 12 min until full</text>
    </g>
  </g>
</svg>
